# Builds ClipForge for Windows, Linux and macOS and attaches the files to a GitHub Release.
# Use: bump "version" in package.json, push, then:  git tag v1.5.0 && git push origin v1.5.0
# (or run it by hand from the Actions tab; then only the build artifacts are produced).
name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, flag: --win }
          - { os: ubuntu-22.04,   name: linux,   flag: --linux }
          - { os: macos-latest,   name: mac-arm, flag: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install

      # ---------- tools bundled inside the app ----------
      - name: Windows tools
        if: matrix.name == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File binaries/get-binaries.ps1

      - name: Linux tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils
          mkdir -p binaries tmp && cd tmp
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ
          cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe ../binaries/
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp && cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build -j --config Release --target whisper-cli
          cp build/bin/whisper-cli ../../binaries/
          chmod +x ../../binaries/*

      - name: macOS tools
        if: matrix.name == 'mac-arm'
        run: |
          brew install cmake
          mkdir -p binaries tmp && cd tmp
          curl -L https://evermeet.cx/ffmpeg/getrelease/zip -o ffmpeg.zip && unzip -o ffmpeg.zip -d ../binaries
          curl -L https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip && unzip -o ffprobe.zip -d ../binaries
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp && cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build -j --config Release --target whisper-cli
          cp build/bin/whisper-cli ../../binaries/
          chmod +x ../../binaries/*

      - run: npx vite build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-${{ matrix.name }}
          path: |
            release/ClipForge-*.exe
            release/ClipForge-*.AppImage
            release/ClipForge-*.dmg
            release/ClipForge-*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
