# Builds ClipForge for Windows, Linux and macOS and attaches the files to a GitHub Release.
# Use: bump "version" in package.json, push, then:  git tag v1.5.0 && git push origin v1.5.0
# (or run it by hand from the Actions tab; then only the build artifacts are produced).
name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, flag: --win, plat: win32, extra: '--config.win.signAndEditExecutable=true' }
          - { os: ubuntu-22.04,   name: linux,   flag: --linux, plat: linux, extra: '' }
          - { os: macos-latest,   name: mac-arm, flag: --mac --arm64, plat: darwin, extra: '', farch: arm64 }
          - { os: macos-15-intel, name: mac-intel, flag: --mac --x64, plat: darwin, extra: '', farch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Run npm install
        shell: bash
        run: |
          # The install downloads big binaries (electron, onnxruntime); the download sometimes times out, so try a few times
          ok=0
          for n in 1 2 3 4; do
            if npm install --no-audit --no-fund; then ok=1; break; fi
            echo "npm install failed (try $n), retrying in 15 s"; sleep 15
          done
          [ "$ok" = 1 ] || exit 1

      # ---------- tools bundled inside the app ----------
      - name: Windows tools
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force binaries, tmp | Out-Null
          curl.exe -fL --retry 4 -o tmp/ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          Expand-Archive tmp/ffmpeg.zip tmp/ff -Force
          Get-ChildItem tmp/ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination binaries -Force
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp tmp/whisper.cpp
          cmake -S tmp/whisper.cpp -B tmp/whisper.cpp/build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build tmp/whisper.cpp/build --config Release --target whisper-cli -j 4
          Get-ChildItem tmp/whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1 | Copy-Item -Destination binaries -Force
          Get-ChildItem binaries

      # optional graphics-card speech engine (Vulkan: NVIDIA, AMD and Intel). If anything here fails the app is still built, it simply uses the processor.
      - name: Windows GPU speech engine (optional)
        if: matrix.name == 'windows'
        continue-on-error: true
        uses: jakoch/install-vulkan-sdk-action@v1
      - name: Build Windows GPU speech engine (optional)
        if: matrix.name == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S tmp/whisper.cpp -B tmp/whisper.cpp/build-vk -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build tmp/whisper.cpp/build-vk --config Release --target whisper-cli -j 4
          Get-ChildItem tmp/whisper.cpp/build-vk -Recurse -Filter whisper-cli.exe | Select-Object -First 1 | Copy-Item -Destination binaries/whisper-cli-gpu.exe -Force
          Get-ChildItem binaries

      - name: Linux tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential xz-utils
          mkdir -p binaries tmp && cd tmp
          # static ffmpeg: GitHub (BtbN) first, then johnvansickle; every try has a time limit and is checked to be a real archive
          got=0
          for U in https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                   https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; do
            echo "Downloading $U"; rm -f ff.tar.xz
            if curl -fL --retry 2 --connect-timeout 20 --max-time 300 -A "Mozilla/5.0" -o ff.tar.xz "$U" && xz -t ff.tar.xz 2>/dev/null; then got=1; break; fi
            echo "Download failed, trying the next source"
          done
          [ "$got" = 1 ] || { echo "Could not download ffmpeg"; exit 1; }
          mkdir ffx && tar -xJf ff.tar.xz -C ffx
          cp "$(find ffx -type f -name ffmpeg | head -1)" "$(find ffx -type f -name ffprobe | head -1)" ../binaries/
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp && cmake -B build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_BUILD_TYPE=Release && cmake --build build -j --config Release --target whisper-cli
          cp build/bin/whisper-cli ../../binaries/
          chmod +x ../../binaries/*
          ls -la ../../binaries

      - name: Linux GPU speech engine (optional)
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update && sudo apt-get install -y vulkan-sdk
          cmake -S tmp/whisper.cpp -B tmp/whisper.cpp/build-vk -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build tmp/whisper.cpp/build-vk -j --config Release --target whisper-cli
          cp tmp/whisper.cpp/build-vk/bin/whisper-cli binaries/whisper-cli-gpu && chmod +x binaries/whisper-cli-gpu
          ls -la binaries

      - name: macOS tools
        if: startsWith(matrix.name, 'mac')
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if ! command -v cmake >/dev/null 2>&1; then
            for i in 1 2 3 4; do brew install cmake && break || { echo "brew failed ($i), retrying"; sleep $((i*10)); }; done
          fi
          cmake --version
          mkdir -p binaries tmp && cd tmp
          NARCH=$( [ "${{ matrix.farch }}" = arm64 ] && echo arm64 || echo x64 )
          for t in ffmpeg ffprobe; do
            ok=0
            # 1) npm registry (most reliable on CI)
            for i in 1 2 3; do
              rm -rf pk && mkdir pk && (cd pk && npm pack @$t-installer/darwin-$NARCH >/dev/null 2>&1 && tar xzf *.tgz && cp package/$t ../../binaries/$t) && { ok=1; break; }
              sleep $((i*5))
            done
            # 2) fallback download sites
            if [ $ok = 0 ]; then
              curl -fL --retry 3 -o $t.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.farch }}/release/$t.zip" \
                || curl -fL --retry 3 -o $t.zip "https://evermeet.cx/ffmpeg/getrelease/$( [ $t = ffprobe ] && echo ffprobe/ )zip"
              unzip -o $t.zip -d ../binaries
            fi
          done
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp && cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build -j --config Release --target whisper-cli
          cp build/bin/whisper-cli ../../binaries/
          chmod +x ../../binaries/*
          ls -la ../../binaries

      - run: node scripts/prune-onnx.cjs ${{ matrix.plat }}
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.flag }} ${{ matrix.extra }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-${{ matrix.name }}
          path: |
            release/ClipForge-*.exe
            release/ClipForge-*.AppImage
            release/ClipForge-*.dmg
            release/ClipForge-*.zip

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Android does not need the desktop-only install scripts (electron and onnxruntime-node download big binaries that can time out)
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          for n in 1 2 3; do npm install --ignore-scripts --no-audit --no-fund && break; echo "npm install failed (try $n), retrying"; sleep 10; done
          test -d node_modules/@capacitor/cli

      # ---------- programs bundled inside the Android app (Android only runs programs shipped as lib*.so) ----------
      - name: Android tools (ffmpeg + whisper)
        run: |
          set -e
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $JNI tmp && cd tmp
          # static arm64 ffmpeg: try GitHub (BtbN) first, then johnvansickle; each download is checked to be a real archive
          got=0
          for U in https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz \
                   https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz \
                   https://www.johnvansickle.com/ffmpeg/builds/ffmpeg-git-arm64-static.tar.xz; do
            echo "Downloading $U"
            rm -f ff.tar.xz
            if curl -fL --retry 2 --connect-timeout 20 --max-time 300 -A "Mozilla/5.0" -o ff.tar.xz "$U" && xz -t ff.tar.xz 2>/dev/null; then got=1; break; fi
            echo "Download failed or is not an archive, trying the next source"
          done
          [ "$got" = 1 ] || { echo "Could not download a static ffmpeg for arm64"; exit 1; }
          mkdir ffx && tar -xJf ff.tar.xz -C ffx
          FF=$(find ffx -type f -name ffmpeg | head -1); FP=$(find ffx -type f -name ffprobe | head -1)
          cp "$FF" ../$JNI/libffmpeg.so
          cp "$FP" ../$JNI/libffprobe.so
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S whisper.cpp -B wb -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build wb --config Release --target whisper-cli -j 4
          cp wb/bin/whisper-cli ../$JNI/libwhisper-cli.so
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip ../$JNI/libwhisper-cli.so || true
          ls -la ../$JNI

      - run: npx vite build
      - run: node scripts/build-mobile.cjs
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          VN=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew assembleRelease -PcfVersionName=$VN -PcfVersionCode=${{ github.run_number }} \
            || ./gradlew assembleRelease -PwithYt=false -PcfVersionName=$VN -PcfVersionCode=${{ github.run_number }}
          mkdir -p ../release && cp app/build/outputs/apk/release/app-release.apk ../release/ClipForge-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-android
          path: release/ClipForge-android-arm64.apk

  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
